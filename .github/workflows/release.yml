name: Release to Chrome Web Store

# Push-to-deploy: bump "version" in extension/manifest.json and push to main.
# A push whose version already has a v<version> tag is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version, skip if already released
        id: version
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released; bump the version in extension/manifest.json to deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.version.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Test and build
        if: steps.version.outputs.skip == 'false'
        run: |
          npm ci
          npm test
          npm run build
          echo "ZIP=$(ls dist/*.zip)" >> "$GITHUB_ENV"

      - name: Upload and publish to Chrome Web Store
        if: steps.version.outputs.skip == 'false'
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          if [ -z "$EXTENSION_ID" ] || [ -z "$PUBLISHER_ID" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "::warning::Chrome Web Store secrets are not set, so the store upload was skipped. Upload $ZIP manually (see README)."
            exit 0
          fi
          npx --yes chrome-webstore-upload-cli@4 --source "$ZIP"

      - name: Tag and create GitHub release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
